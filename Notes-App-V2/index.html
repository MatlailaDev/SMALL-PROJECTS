<!doctype html>
<html>
    <head>
        <title>Notes App Version 2</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!--GOOGLE FONTS-->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">  
        
        <!-- My project is using icons from Solid, Sharp Thin, Sharp Duotone Thin + Brands -->
        <link href="../assets/fontawesome/css/fontawesome.css" rel="stylesheet" />
        <link href="../assets/fontawesome/css/brands.css" rel="stylesheet" />
        <link href="../assets/fontawesome/css/solid.css" rel="stylesheet" />
        <link href="../assets/fontawesome/css/sharp-thin.css" rel="stylesheet" />
        <link href="../assets/fontawesome/css/sharp-duotone-thin.css" rel="stylesheet" />
        <!--MY STYLES-->
        <link rel="stylesheet" href="./css/index.css">
    </head>
    <body>
        <header>
            <h1>NOTES<span><i class="fa-solid fa-pen-to-square"></i></span></h1>
            <button class="add-note-btn" id="add-note-btn">Add Note <span>+</span></button>
            <button class="view-notes-btn" id="view-notes-btn">View Notes</button>
        </header>
        
        <main>

            <form id="notesForm">
                <label for="picture">Image</label>
                <input type="file" name="picture" id="picture" accept="image/*">

                
                <label for="titleEl">Title:</label>
                <input type="text" name="title" id="titleEl">

                <label for="note">Add your note:</label>
                <textarea id="note" name="note"></textarea>

                <button type="submit" id="save" >Save</button>
                <button id="clear">Clear</button>
            </form>
            
            
            <section>
                <div id="displayNote"></div>
                <div id="notesList" class="notesList"></div>
            </section>


        </main>


        
        
        <footer>
            <p>For more of my work visit "Portfolio link"</p>
        </footer>
        
        <script src="./javascript/script.js"></script>
    </body>
</html>
