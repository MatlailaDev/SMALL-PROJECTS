<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>handle Form Submit</title>
</head>
<body>
    
    <form action="#">
        <label for="search"></label>
        <input type="search" name="search" id="search">

        <button id="searchBtn">Search</button>
    </form>


    <form id="form">
        
        <label for="name">Name</label>
        <input type="text" name="name" id="name" autocomplete="on">
    
        <label for="surname">Surname</label>
        <input type="text" name="surname" id="surname" autocomplete="on">
    
        <label for="email">Email</label>
        <input type="email" name="email" id="email" autocomplete="on">


        <button type="submit" id="submitBtn">Submit</button>

        <table id="myTable" border="1">
            <thead>
                <tr>
                <th>Name</th>
                <th>Surname</th>
                <th>Email</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </form>

    <div id="container"></div>




    <script>
        let name = document.getElementById("name")
        let surname = document.getElementById("surname")
        let email = document.getElementById("email")
        let submitBtn = document.getElementById("submitBtn")
        let container = document.getElementById("container")
        let searchBtn = document.getElementById("searchBtn")

        const tbody = document.querySelector("#myTable tbody");

        let dataArray = JSON.parse(localStorage.getItem("dataArray")) || []

        if(dataArray){
            dataArray.forEach(entry => {
                let row = `<tr>
                        <td>${entry.name}</td>
                        <td>${entry.surname}</td>
                        <td>${entry.email}</td>
                        </tr>`;
                tbody.innerHTML += row;

            });

            
            searchBtn.addEventListener('click', function(e){
                let searchInput = document.getElementById("search")
                e.preventDefault()

                const searchTerm = searchInput.value

                const searchResults = dataArray.filter(person => {
                    // Convert both the data and the search term to lowercase for a better match
                    const nameMatch = person.name.toLowerCase().includes(searchTerm.toLowerCase())
                    const surnameMatch = person.surname.toLowerCase().includes(searchTerm.toLowerCase())
                    let concatNameSurname = `${person.name} ${person.surname}`
                    const concatMatch = concatNameSurname.toLowerCase().includes(searchTerm.toLowerCase())

                    return nameMatch || surnameMatch || concatMatch
                })
                console.log(searchResults)
                console.log(searchInput.value)

                container.replaceChildren()

                searchResults.forEach(result =>{
                    let studentCard = `<div style="border: 1px solid #000000; text-align: center; margin-bottom: 10px">
                                        ${result.name}<br>
                                        ${result.surname}<br>
                                        ${result.email}
                                      </div>`
                    
                    container.innerHTML += studentCard

                })
                
            })
            


        }


        form.addEventListener('submit', function(event){
            event.preventDefault()

            // 1. Create a formData object from the form
            const formData = new FormData(event.target)

            // 2. Convert entries to single object
            const newObject = Object.fromEntries(formData.entries())

            // 3. Push the object into array

            if(newObject){
                dataArray.push(newObject)

                localStorage.setItem("dataArray", JSON.stringify(dataArray))
            }

    
            // We don't need a forEach loop here because newObject can be accessed directly to display on screen

            // let row = `<tr>
            //             <td>${newObject.name}</td>
            //             <td>${newObject.surname}</td>
            //             <td>${newObject.email}</td>
            //             </tr>`;
            // tbody.innerHTML += row;

            
            // Better Option(More Efficient)..remember the push to array at the top is important 

            const newRow = tbody.insertRow(-1) //- "-1" inserts a row at the end of the tbody

            // Create cells for each piece of data
            const cell1 = newRow.insertCell(0)
            const cell2 = newRow.insertCell(1)
            const cell3 = newRow.insertCell(2)

            // Set the text content (safer than innerHTML to prevent script injection)
            cell1.textContent = newObject.name
            cell2.textContent = newObject.surname
            cell3.textContent = newObject.email


                        
        
            
            console.log(dataArray)
            console.log(dataArray.length)

            
            
            
        })



    </script>
</body>
</html>
