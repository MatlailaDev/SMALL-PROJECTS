<!doctype html>
<html>
    <head>
        <title>Notes App</title>
        <!--GOOGLE FONTS-->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">  
        
        <!-- My project is using icons from Solid, Sharp Thin, Sharp Duotone Thin + Brands -->
        <link href="./assets/fontawesome/css/fontawesome.css" rel="stylesheet" />
        <link href="./assets/fontawesome/css/brands.css" rel="stylesheet" />
        <link href="./assets/fontawesome/css/solid.css" rel="stylesheet" />
        <link href="./assets/fontawesome/css/sharp-thin.css" rel="stylesheet" />
        <link href="./assets/fontawesome/css/sharp-duotone-thin.css" rel="stylesheet" />
        <!--MY STYLES-->
        <link rel="stylesheet" href="./css/index.css">
    </head>
    <body>
        <header>
            <h1>NOTES<span><i class="fa-solid fa-pen-to-square"></i></span></h1>
            <button class="add-note-btn" id="add-note-btn">Add Note <span>+</span></button>
            <button class="view-notes-btn" id="view-notes-btn">View Notes</button>
        </header>
        
        <main>

            <form>
                <label for="titleEl">Title:</label>
                <input type="text" id="titleEl">

                <label for="note-el">Add your note:</label>
                <textarea id="note-el" name="note-el"></textarea>

                <button id="save">Save</button>
                <button id="clear">Clear</button>
            </form>
            
            
            <section>
                <div class="close-note">X</div>
                <div id="displayNote"></div>
                <ul id="notesList"></ul>
            </section>

            

        </main>

        
        
        <footer>
            <p>For more of my work visit "Portfolio link"</p>
        </footer>
        
        <script src="./javascript/script.js"></script>
    </body>
</html>
